name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project/backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-0123456789-0123456789
          JWT_SECRET_KEY: test-jwt-secret-key-0123456789-0123456789
          MYSQL_HOST: 127.0.0.1
          MYSQL_DATABASE: unused_test_db
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        run: pytest -q
