<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جزئیات کاربر | سیستم مدیریت تسک</title>
  <link rel="icon" type="image/jpeg" href="/assets/images/logo.jpg" sizes="32x32">
<link rel="stylesheet" href="/assets/css/main.css?v=20261023-3">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="logo-icon"><img src="/assets/images/logo.jpg" alt="لوگوی شرکت"></div><div><div class="logo-text">مدیریت تسک</div><div class="logo-sub">سیستم مدیریت</div></div></div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="/dashboard.html"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span><span class="nav-label">داشبورد</span></a>
      <a class="nav-item active" href="/users.html"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span class="nav-label">کاربران</span></a>
      <a class="nav-item" href="/projects.html" data-permission="projects.view"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="nav-label">پروژه‌ها</span></a>
      <a class="nav-item" href="/tasks.html" data-permission="tasks.view"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span><span class="nav-label">وظایف</span></a>
      <a class="nav-item" href="/reports.html" data-permission="reports.view"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-5 5"/><path d="M17 9h2v2"/></svg></span><span class="nav-label">گزارش‌ها</span></a>
    <a class="nav-item" href="/notifications.html" data-permission="notifications.manage"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></span><span class="nav-label">مدیریت اعلان‌ها</span></a></nav>
    <div class="sidebar-footer"><a class="nav-item" href="#" id="logout-btn"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></span><span class="nav-label">خروج</span></a></div>
  </aside>
  <div class="main-content" id="main-content">
    <header class="header" id="header">
      <div class="header-left">
        <button class="sidebar-toggle" id="sidebar-toggle"></button>
        <a href="/users.html" class="btn btn-ghost btn-sm">← کاربران</a>
        <h1 class="page-title" id="user-page-title">جزئیات کاربر</h1>
      </div>
      <div class="header-right header-actions">
        <div class="header-brand"><img src="/assets/images/logo.jpg" alt="لوگوی شرکت فناوری ره آورد رایان تینا"><span>ره آورد رایان تینا</span></div>
        <div class="notification-wrap"><button type="button" id="notification-toggle" class="notification-toggle" aria-label="اعلان‌ها" aria-expanded="false" aria-controls="notification-panel"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="notification-dot" id="notification-dot"></span></button><section id="notification-panel" class="notification-panel hidden" aria-label="اعلان‌ها"><div class="notification-panel-header"><span>اعلان‌ها</span><button type="button" class="btn btn-sm btn-secondary" id="notification-clear">پاک کردن نشان</button></div><div id="notification-list" class="notification-empty"><p>اعلانی برای نمایش وجود ندارد.</p></div></section></div>
        <div class="header-user"><div class="user-avatar" id="header-user-avatar">م</div><div class="user-info"><div class="user-name" id="header-user-name">...</div><div class="user-role" id="header-user-role">...</div></div></div>
      </div>
    </header>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <main class="page-content">
      <div id="user-loading" class="empty-state"><div class="spinner"></div></div>
      <div id="user-content" class="hidden">
        <div class="grid" style="grid-template-columns:320px 1fr;gap:20px">
          <!-- Profile card -->
          <div class="card" style="align-self:start">
            <div style="text-align:center;padding:12px 0 20px">
              <div class="user-avatar" style="width:72px;height:72px;font-size:28px;margin:0 auto 12px" id="detail-avatar">م</div>
              <div style="font-size:18px;font-weight:800" id="detail-name">...</div>
              <div style="color:var(--text-muted);font-size:13px;margin-top:4px" id="detail-role">...</div>
              <div style="margin-top:8px" id="detail-status"></div>
            </div>
            <div style="border-top:1px solid var(--border);padding-top:16px;display:flex;flex-direction:column;gap:10px;font-size:13px" id="detail-meta"></div>
            <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px" data-permission="users.edit">
              <a id="edit-perms-btn" href="#" class="btn btn-secondary"> مدیریت دسترسی‌ها</a>
            </div>
          </div>
          <!-- Stats + tasks -->
          <div>
            <div class="grid grid-4 mb-4" id="user-quick-stats"></div>
            <div class="card">
              <div class="card-title" style="margin-bottom:12px">آخرین وظایف</div>
              <div id="user-tasks-list"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div id="toast-container" class="toast-container"></div>
<script src="/assets/js/api.js?v=20261023-3"></script>
<script src="/assets/js/auth.js?v=20261023-3"></script>
<script src="/assets/js/ui.js?v=20261023-3"></script>
<script>
(async () => {
  const ok = await Auth.initPage();
  if (!ok) return;
  document.getElementById('logout-btn').addEventListener('click', async e => { e.preventDefault(); await Auth.logout(); });

  const userId = new URLSearchParams(window.location.search).get('id');
  if (!userId) { window.location.href = '/users.html'; return; }

  try {
    const [userRes, reportRes] = await Promise.all([
      Api.getUser(userId),
      Api.getUserReport(userId).catch(() => null),
    ]);
    const user = userRes.data;
    const report = reportRes?.data;

    document.getElementById('user-page-title').textContent = user.full_name || user.username;
    document.getElementById('detail-avatar').textContent = (user.full_name||user.username).charAt(0);
    document.getElementById('detail-name').textContent = user.full_name || user.username;
    document.getElementById('detail-role').textContent = user.role === 'ADMIN' ? 'مدیر سیستم' : 'کاربر';
    document.getElementById('detail-status').innerHTML = user.is_active
      ? '<span class="badge badge-success">فعال</span>'
      : '<span class="badge badge-danger">غیرفعال</span>';

    document.getElementById('detail-meta').innerHTML = [
      [' نام کاربری', user.username],
      [' ایمیل', user.email || '—'],
      [' تلفن', user.phone || '—'],
      [' تاریخ شروع', formatDate(user.start_date)],
      [' تاریخ پایان', formatDate(user.end_date)],
      [' عضویت', formatDate(user.created_at)],
    ].map(([k,v]) => `<div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">${k}</span><span style="font-weight:500">${v}</span></div>`).join('');

    document.getElementById('edit-perms-btn').href = `/user-permissions.html?id=${userId}`;

    if (report) {
      const s = report.statistics;
      document.getElementById('user-quick-stats').innerHTML = [
        { label:'کل وظایف', value: s.total_tasks, icon:'' },
        { label:'انجام‌شده', value: s.done + s.approved, icon:'' },
        { label:'نرخ تکمیل', value: s.completion_rate + '%', icon:'' },
        { label:'میانگین نمره', value: s.average_score ?? '—', icon:'' },
      ].map(s => `<div class="stat-card"><div class="stat-info"><div class="stat-label">${s.label}</div><div class="stat-value">${s.value}</div></div><div class="stat-icon" style="background:var(--surface-2);font-size:20px">${s.icon}</div></div>`).join('');
    }

    // Load tasks
    const tasksRes = await Api.getTasks({ assigned_to: userId, page_size: 10 }).catch(() => null);
    const tasks = tasksRes?.data?.items || [];
    document.getElementById('user-tasks-list').innerHTML = tasks.length
      ? `<div class="table-container"><table class="data-table">
          <thead><tr><th>عنوان</th><th>پروژه</th><th>اولویت</th><th>وضعیت</th><th>ددلاین</th></tr></thead>
          <tbody>${tasks.map(t => `<tr>
            <td><a href="/task-details.html?id=${t.id}" style="font-weight:600">${t.title}</a></td>
            <td style="font-size:12px;color:var(--text-muted)">${t.project_name||'—'}</td>
            <td>${priorityBadge(t.priority)}</td>
            <td>${statusBadge(t.status)}</td>
            <td style="font-size:12px">${formatDate(t.deadline)}</td>
          </tr>`).join('')}</tbody>
        </table></div>`
      : '<div class="empty-state" style="padding:24px"><p>وظیفه‌ای وجود ندارد</p></div>';

    document.getElementById('user-loading').classList.add('hidden');
    document.getElementById('user-content').classList.remove('hidden');
  } catch (e) {
    document.getElementById('user-loading').innerHTML = `<p style="color:var(--danger)">${e.message}</p>`;
  }
})();
</script>
</body>
</html>
