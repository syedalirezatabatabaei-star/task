<div id="toast-container" class="toast-container"></div>
<script src="/assets/js/api.js?v=20261023-9"></script>
<script src="/assets/js/auth.js?v=20261023-9"></script>
<script src="/assets/js/ui.js?v=20261023-9"></script>
<script>
const PERM_GROUPS = [
  { label: ' داشبورد', perms: [{ code:'dashboard.view', label:'مشاهده' }] },
  { label: ' کاربران', perms: [
    { code:'users.view', label:'مشاهده' }, { code:'users.create', label:'ایجاد' },
    { code:'users.edit', label:'ویرایش' }, { code:'users.delete', label:'حذف' },
  ]},
  { label: ' پروژه‌ها', perms: [
    { code:'projects.view', label:'مشاهده' }, { code:'projects.create', label:'ایجاد' },
    { code:'projects.edit', label:'ویرایش' }, { code:'projects.delete', label:'حذف' },
    { code:'projects.members.manage', label:'مدیریت اعضا' },
  ]},
  { label: ' مراحل', perms: [
    { code:'stages.view', label:'مشاهده' }, { code:'stages.create', label:'ایجاد' },
    { code:'stages.edit', label:'ویرایش' }, { code:'stages.delete', label:'حذف' },
  ]},
  { label: ' وظایف', perms: [
    { code:'tasks.view', label:'مشاهده' }, { code:'tasks.create', label:'ایجاد' },
    { code:'tasks.edit', label:'ویرایش' }, { code:'tasks.delete', label:'حذف' },
    { code:'tasks.assign', label:'تخصیص' }, { code:'tasks.submit', label:'ارسال' },
  ]},
  { label: ' نقشه راه', perms: [
    { code:'roadmap.view', label:'مشاهده' }, { code:'roadmap.manage', label:'مدیریت' },
  ]},
  { label: ' ارزیابی', perms: [
    { code:'evaluations.view', label:'مشاهده' }, { code:'evaluations.create', label:'ایجاد' },
    { code:'evaluations.edit', label:'ویرایش' },
  ]},
  { label: ' گزارش‌ها', perms: [{ code:'reports.view', label:'مشاهده' }] },
  { label: ' پیوست‌ها', perms: [
    { code:'attachments.view', label:'مشاهده' }, { code:'attachments.upload', label:'آپلود' },
  ]},
  { label: ' لاگ سیستم', perms: [{ code:'audit_logs.view', label:'مشاهده' }] },
  { label: ' اعلان‌ها', perms: [{ code:'notifications.manage', label:'انتشار اعلان عمومی و خصوصی' }] },
];

let userId;
let isAdmin = false;

(async () => {
  const ok = await Auth.initPage();
  if (!ok) return;

  document.getElementById('logout-btn').addEventListener('click', async e => { e.preventDefault(); await Auth.logout(); });

  userId = new URLSearchParams(window.location.search).get('id');
  if (!userId) { window.location.href = '/users.html'; return; }

  await loadPermissions();

  document.getElementById('btn-save-perms').addEventListener('click', savePermissions);
  document.getElementById('btn-select-all').addEventListener('click', () => {
    document.querySelectorAll('.perm-checkbox').forEach(cb => cb.checked = true);
  });
  document.getElementById('btn-clear-all').addEventListener('click', () => {
    document.querySelectorAll('.perm-checkbox').forEach(cb => cb.checked = false);
  });
})();

async function loadPermissions() {
  try {
    const [userRes, permRes] = await Promise.all([Api.getUser(userId), Api.getUserPermissions(userId)]);
    const user = userRes.data;
    const data = permRes.data;

    document.getElementById('perm-user-name').textContent = user.full_name || user.username;
    document.getElementById('perm-user-role').textContent = user.role === 'ADMIN' ? 'مدیر سیستم' : 'کاربر';
    document.getElementById('perm-user-avatar').textContent = (user.full_name || user.username).charAt(0);
    document.getElementById('page-title').textContent = `دسترسی‌های ${user.full_name || user.username}`;

    isAdmin = data.is_admin;

    if (isAdmin) {
      document.getElementById('admin-notice').classList.remove('hidden');
      document.getElementById('perm-admin-msg').classList.remove('hidden');
    } else {
      const userPerms = new Set(data.permissions);
      renderPermGrid(userPerms);
      document.getElementById('perm-grid').classList.remove('hidden');
      document.getElementById('perm-actions').classList.remove('hidden');
      document.getElementById('perm-actions').style.display = 'flex';
    }

    document.getElementById('perm-loading').classList.add('hidden');
    document.getElementById('perm-content').classList.remove('hidden');
  } catch (e) { Toast.error(e.message); }
}

function renderPermGrid(userPerms) {
  const grid = document.getElementById('perm-grid');
  grid.innerHTML = PERM_GROUPS.map(group => `
    <div class="perm-section">
      <div class="perm-section-header">${group.label}</div>
      <div class="perm-items">
        ${group.perms.map(p => `
          <label class="perm-item">
            <input type="checkbox" class="perm-checkbox" data-code="${p.code}" ${userPerms.has(p.code) ? 'checked' : ''}>
            <span>${p.label}</span>
          </label>
        `).join('')}
      </div>
    </div>
  `).join('');
}

async function savePermissions() {
  if (isAdmin) { Toast.info('دسترسی‌های مدیر تغییرپذیر نیست'); return; }
  const btn = document.getElementById('btn-save-perms');
  setLoading(btn, true);
  try {
    const codes = Array.from(document.querySelectorAll('.perm-checkbox:checked')).map(cb => cb.dataset.code);
    await Api.updateUserPermissions(userId, codes);
    Toast.success('دسترسی‌ها با موفقیت ذخیره شد');
  } catch (e) { Toast.error(e.message); }
  finally { setLoading(btn, false); }
}
</script>
</body>
