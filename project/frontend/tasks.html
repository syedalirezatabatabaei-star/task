<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وظایف | سیستم مدیریت تسک</title>
  <link rel="icon" type="image/jpeg" href="/assets/images/logo.jpg" sizes="32x32">
<link rel="stylesheet" href="/assets/css/main.css?v=20261023-9">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="logo-icon"><img src="/assets/images/logo.jpg" alt="لوگوی شرکت"></div><div><div class="logo-text">مدیریت تسک</div><div class="logo-sub">سیستم مدیریت</div></div></div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="/dashboard.html"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span><span class="nav-label">داشبورد</span></a>
      <a class="nav-item" href="/users.html" data-permission="users.view"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span class="nav-label">کاربران</span></a>
      <a class="nav-item" href="/projects.html" data-permission="projects.view"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="nav-label">پروژه‌ها</span></a>
      <a class="nav-item active" href="/tasks.html" data-permission="tasks.view"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span><span class="nav-label">وظایف</span></a>
      <a class="nav-item" href="/reports.html" data-permission="reports.view"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-5 5"/><path d="M17 9h2v2"/></svg></span><span class="nav-label">گزارش‌ها</span></a>
    <a class="nav-item" href="/notifications.html" data-permission="notifications.manage"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></span><span class="nav-label">مدیریت اعلان‌ها</span></a></nav>
    <div class="sidebar-footer"><a class="nav-item" href="#" id="logout-btn"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></span><span class="nav-label">خروج</span></a></div>
  </aside>
  <div class="main-content" id="main-content">
    <header class="header" id="header">
      <div class="header-left">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="نمایش منو"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <h1 class="page-title">وظایف</h1>
      </div>
      <div class="header-right header-actions">
        <div class="header-brand"><img src="/assets/images/logo.jpg" alt="لوگوی شرکت فناوری ره آورد رایان تینا"><span>ره آورد رایان تینا</span></div>
        <div class="notification-wrap"><button type="button" id="notification-toggle" class="notification-toggle" aria-label="اعلان‌ها" aria-expanded="false" aria-controls="notification-panel"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="notification-dot" id="notification-dot"></span></button><section id="notification-panel" class="notification-panel hidden" aria-label="اعلان‌ها"><div class="notification-panel-header"><span>اعلان‌ها</span><button type="button" class="btn btn-sm btn-secondary" id="notification-clear">پاک کردن نشان</button></div><div id="notification-list" class="notification-empty"><p>اعلانی برای نمایش وجود ندارد.</p></div></section></div>
        <button class="btn btn-primary" id="btn-add-task" data-permission="tasks.create">+ وظیفه جدید</button>
        <div class="header-user"><div class="user-avatar" id="header-user-avatar">م</div><div class="user-info"><div class="user-name" id="header-user-name">...</div><div class="user-role" id="header-user-role">...</div></div></div>
      </div>
    </header>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="page-content">
      <!-- Filters -->
      <div class="card mb-4">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <div class="search-bar" style="flex:1;min-width:180px">
            <span></span><input type="text" id="search-input" placeholder="جستجو در وظایف...">
          </div>
          <select class="form-control" id="filter-status" style="width:145px">
            <option value="">همه وضعیت‌ها</option>
            <option value="TODO">در انتظار</option>
            <option value="IN_PROGRESS">در حال انجام</option>
            <option value="SUBMITTED">ارسال شده</option>
            <option value="NEEDS_REVISION">نیاز به اصلاح</option>
            <option value="APPROVED">تأیید شده</option>
            <option value="DONE">انجام شده</option>
          </select>
          <select class="form-control" id="filter-priority" style="width:120px">
            <option value="">همه اولویت‌ها</option>
            <option value="LOW">کم</option>
            <option value="MEDIUM">متوسط</option>
            <option value="HIGH">بالا</option>
            <option value="URGENT">فوری</option>
          </select>
        </div>
      </div>

      <!-- List View -->
      <div id="list-view">
        <div class="card p-0">
          <div class="table-container" id="tasks-table-container">
            <div class="empty-state" style="padding:48px"><div class="spinner"></div></div>
          </div>
          <div class="pagination" id="pagination" style="padding:12px 16px"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Task Modal -->
<div class="modal-overlay" id="task-modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 class="modal-title" id="task-modal-title">وظیفه جدید</h3>
      <button class="modal-close" onclick="Modal.close('task-modal')"></button>
    </div>
    <div class="modal-body">
      <form id="task-form">
        <div class="form-group">
          <label class="form-label">عنوان <span class="required">*</span></label>
          <input type="text" class="form-control" id="f-title" placeholder="عنوان وظیفه">
        </div>
        <div class="form-group">
          <label class="form-label">توضیحات</label>
          <textarea class="form-control" id="f-desc" rows="3" placeholder="توضیحات کامل وظیفه"></textarea>
        </div>
        <div class="grid grid-2">
          <div class="form-group">
            <label class="form-label">پروژه <span class="required">*</span></label>
            <select class="form-control" id="f-project"></select>
          </div>
          <div class="form-group">
            <label class="form-label">مرحله</label>
            <select class="form-control" id="f-stage"><option value="">بدون مرحله</option></select>
          </div>
        </div>
        <div class="grid grid-2">
          <div class="form-group">
            <label class="form-label">تخصیص به</label>
            <select class="form-control" id="f-assignee"><option value="">انتخاب کاربر</option></select>
          </div>
          <div class="form-group">
            <label class="form-label">اولویت</label>
            <select class="form-control" id="f-priority">
              <option value="LOW">کم</option>
              <option value="MEDIUM" selected>متوسط</option>
              <option value="HIGH">بالا</option>
              <option value="URGENT">فوری</option>
            </select>
          </div>
        </div>
        <div class="grid grid-2">
          <div class="form-group">
            <label class="form-label">تاریخ شروع</label>
            <input type="date" class="form-control" id="f-start">
          </div>
          <div class="form-group">
            <label class="form-label">ددلاین</label>
            <input type="date" class="form-control" id="f-deadline">
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="Modal.close('task-modal')">انصراف</button>
      <button class="btn btn-primary" id="task-save-btn">ذخیره</button>
    </div>
  </div>
</div>

<!-- Submit Modal -->
<div class="modal-overlay" id="submit-modal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3 class="modal-title">ارسال وظیفه</h3>
      <button class="modal-close" onclick="Modal.close('submit-modal')"></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">توضیحات (اختیاری)</label>
        <textarea class="form-control" id="submit-comment" rows="3" placeholder="توضیحات ارسال..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">درصد پیشرفت</label>
        <input type="number" class="form-control" id="submit-progress" min="0" max="100" value="100">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="Modal.close('submit-modal')">انصراف</button>
      <button class="btn btn-primary" id="submit-save-btn">ارسال</button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="/assets/js/api.js?v=20261023-9"></script>
<script src="/assets/js/auth.js?v=20261023-9"></script>
<script src="/assets/js/ui.js?v=20261023-9"></script>
<script>
let currentPage = 1;
const pageSize = 15;
let editingTaskId = null;
let submitTaskId = null;


(async () => {
  const ok = await Auth.initPage();
  if (!ok) return;
  document.getElementById('logout-btn').addEventListener('click', async e => { e.preventDefault(); await Auth.logout(); });
  document.getElementById('btn-add-task').addEventListener('click', openCreateModal);
  document.getElementById('task-save-btn').addEventListener('click', saveTask);
  document.getElementById('submit-save-btn').addEventListener('click', doSubmit);
  let dt;
  ['search-input','filter-status','filter-priority'].forEach(id => {
    document.getElementById(id).addEventListener(id === 'search-input' ? 'input' : 'change', () => {
      if (id === 'search-input') { clearTimeout(dt); dt = setTimeout(() => { currentPage=1; loadView(); }, 400); }
      else { currentPage=1; loadView(); }
    });
  });
  await loadProjects();
  await loadUsers();
  await loadView();
})();

function getFilters() {
  const p = { page: currentPage, page_size: pageSize };
  const s = document.getElementById('search-input').value.trim();
  const st = document.getElementById('filter-status').value;
  const pr = document.getElementById('filter-priority').value;
  if (s) p.search = s;
  if (st) p.status = st;
  if (pr) p.priority = pr;
  return p;
}

async function loadView() { await loadList(); }

async function loadList() {
  const container = document.getElementById('tasks-table-container');
  container.innerHTML = '<div class="empty-state" style="padding:48px"><div class="spinner"></div></div>';
  try {
    const res = await Api.getTasks(getFilters());
    const { items, total, pages } = res.data;
    if (!items.length) {
      container.innerHTML = '<div class="empty-state" style="padding:48px"><div class="empty-state-icon"></div><div class="empty-state-title">وظیفه‌ای یافت نشد</div></div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }
    const isAdmin = Api.getCurrentUser()?.role === 'ADMIN';
    const canEdit = Api.hasPermission('tasks.edit');
    const canDelete = Api.hasPermission('tasks.delete');
    container.innerHTML = `
      <table class="data-table">
        <thead><tr>
          <th>عنوان</th><th>پروژه</th>
          ${isAdmin ? '<th>مسئول</th>' : ''}
          <th>اولویت</th><th>وضعیت</th><th>پیشرفت</th><th>ددلاین</th><th>عملیات</th>
        </tr></thead>
        <tbody>
          ${items.map(t => {
            const overdue = t.deadline && new Date(t.deadline) < new Date() && !['DONE','APPROVED'].includes(t.status);
            return `<tr>
              <td><a href="/task-details.html?id=${Number(t.id)}" style="font-weight:600;color:var(--text)">${escapeHtml(t.title)}</a></td>
              <td><span style="font-size:12px;color:var(--text-muted)">${escapeHtml(t.project_name || '—')}</span></td>
              ${isAdmin ? `<td>${escapeHtml(t.assignee_name || '—')}</td>` : ''}
              <td>${priorityBadge(t.priority)}</td>
              <td>${statusBadge(t.status)}</td>
              <td style="min-width:120px">${progressBar(t.progress)}</td>
              <td style="font-size:12px;${overdue?'color:var(--danger);font-weight:600':''}">${t.deadline?formatDate(t.deadline):'—'}</td>
              <td>
                <div style="display:flex;gap:4px">
                  <a href="/task-details.html?id=${t.id}" class="btn btn-sm btn-secondary"></a>
                  ${canEdit ? `<button class="btn btn-sm btn-secondary" data-permission="tasks.edit" title="ویرایش" aria-label="ویرایش" onclick="openEditModal(${Number(t.id)})"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"/></svg></button>` : ''}
                  ${['TODO','IN_PROGRESS','NEEDS_REVISION'].includes(t.status) && t.assigned_to == Api.getCurrentUser()?.id
                    ? `<button class="btn btn-sm btn-primary" data-permission="tasks.submit" onclick="openSubmitModal(${Number(t.id)})"> ارسال</button>` : ''}
                  ${canDelete ? `<button class="btn btn-sm btn-danger" data-permission="tasks.delete" title="حذف" aria-label="حذف" onclick="deleteTask(${Number(t.id)})"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 10v6M14 10v6"/></svg></button>` : ''}
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
    renderPagination('pagination', currentPage, pages, total, pageSize, p => { currentPage=p; loadList(); });
  } catch (e) {
    container.innerHTML = '<div class="empty-state" style="padding:48px;color:var(--danger)"></div>';
    container.firstElementChild.textContent = e.message || 'خطا در دریافت وظایف';
  }
}

async function loadProjects() {
  try {
    const res = await Api.getProjects({ page_size: 100 });
    const sel = document.getElementById('f-project');
    sel.innerHTML = '<option value="">انتخاب پروژه</option>' +
      res.data.items.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
    sel.addEventListener('change', async () => {
      const pid = sel.value;
      const stSel = document.getElementById('f-stage');
      stSel.innerHTML = '<option value="">بدون مرحله</option>';
      if (!pid) return;
      try {
        const sr = await Api.getStages(pid);
        stSel.innerHTML += sr.data.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
      } catch {}
    });
  } catch {}
}

async function loadUsers() {
  try {
    const res = await Api.getUsers({ page_size: 100 });
    const sel = document.getElementById('f-assignee');
    sel.innerHTML = '<option value="">انتخاب کاربر</option>' +
      res.data.items.map(u => `<option value="${u.id}">${escapeHtml(u.full_name || u.username)}</option>`).join('');
  } catch {}
}

function openCreateModal() {
  editingTaskId = null;
  document.getElementById('task-modal-title').textContent = 'وظیفه جدید';
  document.getElementById('task-form').reset();
  Modal.open('task-modal');
}

async function openEditModal(id) {
  try {
    const res = await Api.getTask(id);
    const t = res.data;
    editingTaskId = id;
    document.getElementById('task-modal-title').textContent = 'ویرایش وظیفه';
    document.getElementById('f-title').value = t.title;
    document.getElementById('f-desc').value = t.description || '';
    document.getElementById('f-project').value = t.project_id;
    document.getElementById('f-project').dispatchEvent(new Event('change'));
    setTimeout(() => {
      document.getElementById('f-stage').value = t.stage_id || '';
      document.getElementById('f-assignee').value = t.assigned_to || '';
    }, 300);
    document.getElementById('f-priority').value = t.priority;
    document.getElementById('f-start').value = t.start_date || '';
    document.getElementById('f-deadline').value = t.deadline || '';
    Modal.open('task-modal');
  } catch (e) { Toast.error(e.message); }
}

async function saveTask() {
  const btn = document.getElementById('task-save-btn');
  setLoading(btn, true);
  try {
    const data = {
      title: document.getElementById('f-title').value.trim(),
      description: document.getElementById('f-desc').value.trim() || null,
      project_id: parseInt(document.getElementById('f-project').value),
      stage_id: parseInt(document.getElementById('f-stage').value) || null,
      assigned_to: parseInt(document.getElementById('f-assignee').value) || null,
      priority: document.getElementById('f-priority').value,
      start_date: document.getElementById('f-start').value || null,
      deadline: document.getElementById('f-deadline').value || null,
    };
    if (!data.title || !data.project_id) { Toast.warning('عنوان و پروژه الزامی است'); return; }
    if (editingTaskId) { await Api.updateTask(editingTaskId, data); Toast.success('وظیفه ویرایش شد'); }
    else { await Api.createTask(data); Toast.success('وظیفه ایجاد شد'); }
    Modal.close('task-modal');
    await loadView();
  } catch (e) { Toast.error(e.message); }
  finally { setLoading(btn, false); }
}

function openSubmitModal(id) {
  submitTaskId = id;
  document.getElementById('submit-comment').value = '';
  document.getElementById('submit-progress').value = 100;
  Modal.open('submit-modal');
}

async function doSubmit() {
  const btn = document.getElementById('submit-save-btn');
  setLoading(btn, true);
  try {
    await Api.submitTask(submitTaskId, {
      comment: document.getElementById('submit-comment').value.trim() || null,
      progress: parseInt(document.getElementById('submit-progress').value) || 100,
    });
    Toast.success('وظیفه با موفقیت ارسال شد');
    Modal.close('submit-modal');
    await loadView();
  } catch (e) { Toast.error(e.message); }
  finally { setLoading(btn, false); }
}

async function deleteTask(id) {
  confirmAction('آیا از حذف این وظیفه مطمئن هستید؟', async () => {
    try { await Api.deleteTask(id); Toast.success('وظیفه حذف شد'); await loadView(); }
    catch (e) { Toast.error(e.message); }
  });
}
</script>
</body>
</html>
