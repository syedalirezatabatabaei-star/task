<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود | سیستم مدیریت تسک</title>
  <link rel="icon" type="image/jpeg" href="/assets/images/logo.jpg" sizes="32x32">
<style>
    @font-face { font-family: 'TaskFont'; src: url('/assets/Font/yRmh9nfC'); font-style: normal; font-weight: 100 900; font-display: swap; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { direction: rtl; font-size: 14px; }
    body {
      font-family: 'TaskFont', 'Vazirmatn', Tahoma, sans-serif;
      background: linear-gradient(135deg, #071a3d 0%, #0b3c78 52%, #1677bd 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.2);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #0b2b59, #1677bd);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 28px;
      color: white;
    }
    .login-title {
      font-size: 22px; font-weight: 800; color: #0f172a;
    }
    .login-subtitle {
      font-size: 13px; color: #94a3b8; margin-top: 4px;
    }
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; font-size: 13px; font-weight: 600;
      color: #374151; margin-bottom: 6px;
    }
    .input-wrapper { position: relative; }
    .form-control {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid #e2e8f0; border-radius: 10px;
      font-family: inherit; font-size: 14px; color: #0f172a;
      outline: none; transition: all 0.2s;
      -webkit-appearance: none;
    }
    .form-control:focus {
      border-color: #1677bd;
      box-shadow: 0 0 0 3px rgba(22,119,189,0.16);
    }
    .form-control.has-icon { padding-right: 42px; }
    .input-icon-right {
      position: absolute; top: 50%; transform: translateY(-50%);
      right: 14px; color: #94a3b8; pointer-events: none; font-size: 16px;
    }
    .toggle-password {
      position: absolute; top: 50%; transform: translateY(-50%);
      left: 12px; background: none; border: none;
      cursor: pointer; color: #94a3b8; font-size: 16px;
      padding: 4px; border-radius: 4px;
    }
    .toggle-password:hover { color: #1677bd; }
    .error-box {
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 10px; padding: 12px 14px;
      color: #dc2626; font-size: 13px; margin-bottom: 16px;
      display: none; align-items: center; gap: 8px;
    }
    .error-box.visible { display: flex; }
    .btn-login {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; border: none; border-radius: 10px;
      font-family: inherit; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(11,43,89,0.32);
    }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .login-footer {
      text-align: center; margin-top: 24px;
      font-size: 12px; color: #94a3b8;
    }
    .auth-shell { width: min(1100px, 100%); min-height: 620px; display: grid; grid-template-columns: 1fr 1fr; direction: ltr; overflow: hidden; border-radius: 20px; background: #fff; box-shadow: 0 25px 50px rgba(0,0,0,.2); }
    .brand-panel { display:flex; align-items:center; justify-content:center; padding:36px; background:linear-gradient(145deg,#e8f2fc 0%,#d6e8f8 50%,#f1f7fd 100%); }
    .brand-panel img { display:block; width:100%; max-width:460px; max-height:520px; object-fit:contain; }
    .form-panel { display:flex; align-items:center; justify-content:center; padding:28px; direction:rtl; background:#fff; }
    .login-container { box-shadow:none; border-radius:0; padding:20px; max-width:420px; }
    .logo-icon { background:transparent; font-size:0; }
    .logo-icon img { width:100%; height:100%; object-fit:contain; }
    .login-subtitle { display:block; font-size:14px; font-weight:700; color:#174675; margin-top:9px; }
    .input-icon-right { display:none; }
    .form-control.has-icon { padding-right:14px; }
    @media (max-width:760px) { body { padding:12px; } .auth-shell { grid-template-columns:1fr; min-height:0; } .brand-panel { padding:16px; } .brand-panel img { max-width:230px; max-height:170px; } .form-panel { padding:12px; } .login-container { padding:22px 10px; } }
  </style>
</head>
<body>
  <main class="auth-shell">
    <section class="brand-panel" aria-label="نشان سامانه"><img src="/assets/images/logo1.png" alt="نشان سیستم مدیریت تسک"></section>
    <section class="form-panel">
    <div class="login-container">
    <div class="login-logo">
      <div class="logo-icon"><img src="/assets/images/logo.jpg" alt="لوگوی سامانه"></div>
      <h1 class="login-title">سیستم مدیریت تسک</h1>
      <p class="login-subtitle">شرکت فناوری ره آورد رایان تینا</p>
    </div>

    <div class="error-box" id="error-box">
      <span aria-hidden="true">&#x26A0;&#xFE0F;</span>
      <span id="error-message"></span>
    </div>

    <form id="login-form" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="username">نام کاربری</label>
        <div class="input-wrapper">
          <input type="text" id="username" name="username" class="form-control has-icon"
            placeholder="نام کاربری خود را وارد کنید" autocomplete="username" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">رمز عبور</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" class="form-control has-icon"
            placeholder="رمز عبور خود را وارد کنید" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="toggle-password" title="نمایش رمز عبور" aria-label="نمایش رمز عبور">
            <svg id="password-eye" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="login-btn">
        <span class="spinner" id="login-spinner"></span>
        <span class="btn-text">ورود به سیستم</span>
      </button>
    </form>

    <div class="login-footer">
      شرکت فناوری ره آورد رایان تینا &nbsp;|&nbsp; نسخه ۱.۰
    </div>
    </section>
  </main>

  <script>
    const API_BASE = window.API_BASE_URL || 'http://localhost:8000/api/v1';
    const isLocalDemoHost = ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);
    const demoRequested = new URLSearchParams(window.location.search).get('demo') === '1';
    if (demoRequested) sessionStorage.setItem('task_demo_enabled', 'true');

// Do not auto-redirect based on an old token; let the user choose demo or real login.
    if (localStorage.getItem('task_demo_mode') === 'true'
        && (isLocalDemoHost || sessionStorage.getItem('task_demo_enabled') === 'true')) {
      window.location.href = '/dashboard.html';
    }

    const form = document.getElementById('login-form');
    const loginBtn = document.getElementById('login-btn');
    const errorBox = document.getElementById('error-box');
    const errorMsg = document.getElementById('error-message');
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');

    toggleBtn.addEventListener('click', () => {
      const showPassword = passwordInput.type === 'password';
      passwordInput.type = showPassword ? 'text' : 'password';
      toggleBtn.innerHTML = showPassword
        ? '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.5 15.5 0 0 1-4 4.7"/><path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.2 0 2.3-.2 3.3-.6"/></svg>'
        : '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
      toggleBtn.title = showPassword ? 'پنهان کردن رمز عبور' : 'نمایش رمز عبور';
      toggleBtn.setAttribute('aria-label', toggleBtn.title);
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorBox.classList.add('visible');
    }

    function hideError() {
      errorBox.classList.remove('visible');
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      loginBtn.classList.toggle('loading', loading);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('لطفاً نام کاربری و رمز عبور را وارد کنید.');
        return;
      }

      // Local-only demo login for frontend development; never enabled on public hosts.
      const demoAllowed = isLocalDemoHost || sessionStorage.getItem('task_demo_enabled') === 'true';
      if (demoAllowed && username === 'admin' && password === 'admin') {
        localStorage.setItem('task_demo_mode', 'true');
        localStorage.setItem('current_user', JSON.stringify({
          id: 0,
          username: 'admin',
          full_name: 'مدیر آزمایشی',
          role: 'ADMIN',
          permissions: []
        }));
        localStorage.setItem('user_permissions', JSON.stringify([]));
        localStorage.removeItem('access_token');
        window.location.href = '/dashboard.html';
        return;
      }

      setLoading(true);

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.detail?.message || 'نام کاربری یا رمز عبور اشتباه است.');
          return;
        }

        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('current_user', JSON.stringify(data.user));

        // Fetch permissions
        const meRes = await fetch(`${API_BASE}/auth/me`, {
          headers: { 'Authorization': `Bearer ${data.access_token}` }
        });
        const meData = await meRes.json();
        if (meData && meData.data) {
          localStorage.setItem('user_permissions', JSON.stringify(meData.data.permissions || []));
          localStorage.setItem('current_user', JSON.stringify(meData.data));
        }

        window.location.href = '/dashboard.html';
      } catch (err) {
        showError('خطا در اتصال به سرور. لطفاً دوباره تلاش کنید.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
