<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جزئیات پروژه | سیستم مدیریت تسک</title>
  <link rel="icon" type="image/jpeg" href="/assets/images/logo.jpg" sizes="32x32">
<link rel="stylesheet" href="/assets/css/main.css?v=20261023-8">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="logo-icon"><img src="/assets/images/logo.jpg" alt="لوگوی شرکت"></div><div><div class="logo-text">مدیریت تسک</div><div class="logo-sub">سیستم مدیریت</div></div></div>
    <nav class="sidebar-nav">
      <a class="nav-item" href="/dashboard.html"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span><span class="nav-label">داشبورد</span></a>
      <a class="nav-item" href="/users.html" data-permission="users.view"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span class="nav-label">کاربران</span></a>
      <a class="nav-item active" href="/projects.html"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="nav-label">پروژه‌ها</span></a>
      <a class="nav-item" href="/tasks.html" data-permission="tasks.view"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span><span class="nav-label">وظایف</span></a>
      <a class="nav-item" href="/reports.html" data-permission="reports.view"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-5 5"/><path d="M17 9h2v2"/></svg></span><span class="nav-label">گزارش‌ها</span></a>
    <a class="nav-item" href="/notifications.html" data-permission="notifications.manage"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></span><span class="nav-label">مدیریت اعلان‌ها</span></a></nav>
    <div class="sidebar-footer"><a class="nav-item" href="#" id="logout-btn"><span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></span><span class="nav-label">خروج</span></a></div>
  </aside>
  <div class="main-content" id="main-content">
    <header class="header" id="header">
      <div class="header-left">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="نمایش منو"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <a href="/projects.html" class="btn btn-ghost btn-sm">← پروژه‌ها</a>
        <h1 class="page-title" id="project-title">جزئیات پروژه</h1>
      </div>
      <div class="header-right header-actions">
        <div class="header-brand"><img src="/assets/images/logo.jpg" alt="لوگوی شرکت فناوری ره آورد رایان تینا"><span>ره آورد رایان تینا</span></div>
        <div class="notification-wrap">
          <button type="button" id="notification-toggle" class="notification-toggle" aria-label="اعلان‌ها" aria-expanded="false" aria-controls="notification-panel">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span class="notification-dot" id="notification-dot"></span>
          </button>
          <section id="notification-panel" class="notification-panel hidden" aria-label="اعلان‌ها"><div class="notification-panel-header"><span>اعلان‌ها</span><button type="button" class="btn btn-sm btn-secondary" id="notification-clear">پاک کردن نشان</button></div><div id="notification-list" class="notification-empty"><p>اعلانی برای نمایش وجود ندارد.</p></div></section>
        </div>
        <div class="header-user"><div class="user-avatar" id="header-user-avatar">م</div><div class="user-info"><div class="user-name" id="header-user-name">...</div><div class="user-role" id="header-user-role">...</div></div></div>
      </div>
    </header>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <main class="page-content">
      <div id="project-loading" class="empty-state"><div class="spinner"></div></div>
      <div id="project-content" class="hidden">
        <!-- Overview card -->
        <div class="card mb-4" id="overview-card"></div>
        <!-- Tabs -->
        <div id="project-tabs">
          <div class="tabs">
            <button class="tab-btn active" data-tab="tab-stages">مراحل</button>
            <button class="tab-btn" data-tab="tab-tasks">وظایف</button>
            <button class="tab-btn" data-tab="tab-members">اعضا</button>
            <button class="tab-btn" id="tab-roadmap-btn" data-tab="tab-roadmap">نقشه راه</button>
          </div>

          <div class="tab-content active" id="tab-stages">
            <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
              <button class="btn btn-primary btn-sm" id="btn-add-stage" data-permission="stages.create" data-permission="stages.create">+ مرحله جدید</button>
            </div>
            <div id="stages-list"></div>
          </div>

          <div class="tab-content" id="tab-tasks">
            <div id="project-tasks-list"></div>
          </div>

          <div class="tab-content" id="tab-members">
            <div style="display:flex;justify-content:flex-end;margin-bottom:12px" data-permission="projects.members.manage">
              <button class="btn btn-primary btn-sm" id="btn-add-member" data-permission="projects.members.manage">+ افزودن عضو</button>
            </div>
            <div id="members-list"></div>
          </div>

          <div class="tab-content" id="tab-roadmap">
            <div id="roadmap-container"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Stage Modal -->
<div class="modal-overlay" id="stage-modal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3 class="modal-title" id="stage-modal-title">مرحله جدید</h3>
      <button class="modal-close" onclick="Modal.close('stage-modal')"></button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">نام مرحله <span class="required">*</span></label><input type="text" class="form-control" id="sf-name"></div>
      <div class="form-group"><label class="form-label">توضیحات</label><textarea class="form-control" id="sf-desc" rows="2"></textarea></div>
      <div class="grid grid-2">
        <div class="form-group"><label class="form-label">ترتیب</label><input type="number" class="form-control" id="sf-order" value="0"></div>
        <div class="form-group"><label class="form-label">ددلاین</label><input type="date" class="form-control" id="sf-end"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="Modal.close('stage-modal')">انصراف</button>
      <button class="btn btn-primary" id="stage-save-btn">ذخیره</button>
    </div>
  </div>
</div>

<!-- Member Modal -->
<div class="modal-overlay" id="member-modal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3 class="modal-title">افزودن عضو</h3>
      <button class="modal-close" onclick="Modal.close('member-modal')"></button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">کاربر <span class="required">*</span></label><select class="form-control" id="mf-user"></select></div>
      <div class="form-group"><label class="form-label">نقش در پروژه</label><input type="text" class="form-control" id="mf-role" placeholder="مثال: توسعه‌دهنده"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="Modal.close('member-modal')">انصراف</button>
      <button class="btn btn-primary" id="member-save-btn">افزودن</button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="/assets/js/api.js?v=20261023-8"></script>
<script src="/assets/js/auth.js?v=20261023-8"></script>
<script src="/assets/js/ui.js?v=20261023-8"></script>
<script>
let projectId;
let project;
let editingStageId = null;

(async () => {
  const ok = await Auth.initPage();
  if (!ok) return;
  document.getElementById('logout-btn').addEventListener('click', async e => { e.preventDefault(); await Auth.logout(); });

  projectId = new URLSearchParams(window.location.search).get('id');
  if (!projectId) { window.location.href = '/projects.html'; return; }

  await loadProject();

  document.getElementById('btn-add-stage').addEventListener('click', () => { editingStageId=null; document.getElementById('sf-name').value=''; document.getElementById('sf-desc').value=''; document.getElementById('sf-order').value=0; document.getElementById('sf-end').value=''; document.getElementById('stage-modal-title').textContent='مرحله جدید'; Modal.open('stage-modal'); });
  document.getElementById('stage-save-btn').addEventListener('click', saveStage);
  document.getElementById('btn-add-member').addEventListener('click', openMemberModal);
  document.getElementById('member-save-btn').addEventListener('click', saveMember);

  // Tabs
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab)?.classList.add('active');
      if (btn.dataset.tab === 'tab-roadmap') loadRoadmap();
    });
  });
})();

async function loadProject() {
  try {
    const res = await Api.getProject(projectId);
    project = res.data;
    document.getElementById('project-title').textContent = project.name;

    document.getElementById('overview-card').innerHTML = `
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px">
        <div>
          <h2 style="font-size:20px;font-weight:800;margin-bottom:8px">${escapeHtml(project.name)}</h2>
          <p style="color:var(--text-secondary);font-size:14px;max-width:600px">${escapeHtml(project.description || 'بدون توضیحات')}</p>
          <div style="display:flex;gap:16px;margin-top:12px;flex-wrap:wrap">
            <span style="font-size:13px;color:var(--text-muted)"> شروع: ${project.start_date?formatDate(project.start_date):'—'}</span>
            <span style="font-size:13px;color:var(--text-muted)"> پایان: ${project.end_date?formatDate(project.end_date):'—'}</span>
            <span style="font-size:13px;color:var(--text-muted)"> ${project.member_count} عضو</span>
            <span style="font-size:13px;color:var(--text-muted)"> ${project.completed_task_count}/${project.task_count} وظیفه</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
          ${projectStatusBadge(project.status)}
          <div style="min-width:200px">${progressBar(project.progress)}</div>
        </div>
      </div>`;

    if (!project.show_roadmap || !Api.hasPermission('roadmap.view')) {
      document.getElementById('tab-roadmap-btn').style.display = 'none';
    }

    renderStages(project.stages || []);
    renderMembers(project.members || []);
    await loadProjectTasks();

    document.getElementById('project-loading').classList.add('hidden');
    document.getElementById('project-content').classList.remove('hidden');
  } catch (e) {
    Toast.error(e.message);
    document.getElementById('project-loading').textContent = e.message || 'بارگذاری پروژه ناموفق بود';
  }
}

function renderStages(stages) {
  const el = document.getElementById('stages-list');
  if (!stages.length) {
    el.innerHTML = '<div class="empty-state" style="padding:32px"><div class="empty-state-icon"></div><div class="empty-state-title">مرحله‌ای وجود ندارد</div></div>';
    return;
  }
  el.innerHTML = stages.map(s => `
    <div class="card mb-4" style="padding:14px 18px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <span style="font-weight:700;font-size:15px">${s.order_index+1}. ${escapeHtml(s.name)}</span>
          ${s.description ? `<div style="font-size:13px;color:var(--text-muted);margin-top:3px">${escapeHtml(s.description)}</div>` : ''}
          <div style="font-size:12px;color:var(--text-muted);margin-top:4px">
            ${s.task_count} وظیفه &nbsp;|&nbsp; ${s.completed_task_count} انجام‌شده
            ${s.end_date ? ` &nbsp;|&nbsp; ددلاین: ${formatDate(s.end_date)}` : ''}
          </div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <div style="min-width:120px">${progressBar(s.progress)}</div>
          <button class="btn btn-sm btn-danger" onclick="deleteStage(${Number(s.id)})" data-permission="stages.delete"></button>
        </div>
      </div>
    </div>
  `).join('');
}

async function loadProjectTasks() {
  const el = document.getElementById('project-tasks-list');
  try {
    const res = await Api.getTasks({ project_id: projectId, page_size: 50 });
    const tasks = res.data.items;
    if (!tasks.length) {
      el.innerHTML = '<div class="empty-state" style="padding:32px"><div class="empty-state-title">وظیفه‌ای وجود ندارد</div></div>';
      return;
    }
    el.innerHTML = `<div class="table-container"><table class="data-table">
      <thead><tr><th>عنوان</th><th>مسئول</th><th>اولویت</th><th>وضعیت</th><th>ددلاین</th><th></th></tr></thead>
      <tbody>${tasks.map(t => `<tr>
        <td><a href="/task-details.html?id=${Number(t.id)}" style="font-weight:600">${escapeHtml(t.title)}</a></td>
        <td>${escapeHtml(t.assignee_name || '—')}</td>
        <td>${priorityBadge(t.priority)}</td>
        <td>${statusBadge(t.status)}</td>
        <td style="font-size:12px">${t.deadline?formatDate(t.deadline):'—'}</td>
        <td><a href="/task-details.html?id=${t.id}" class="btn btn-sm btn-secondary"></a></td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  } catch (e) { el.textContent = e.message || 'بارگذاری وظایف ناموفق بود'; }
}

function renderMembers(members) {
  const el = document.getElementById('members-list');
  if (!members.length) {
    el.innerHTML = '<div class="empty-state" style="padding:32px"><div class="empty-state-title">عضوی وجود ندارد</div></div>';
    return;
  }
  el.innerHTML = `<div class="grid grid-3">${members.map(m => `
    <div class="card" style="padding:14px;display:flex;align-items:center;gap:12px">
      <div class="user-avatar" style="width:40px;height:40px;font-size:16px">${escapeHtml((m.user?.full_name||'?').charAt(0))}</div>
      <div style="flex:1">
        <div style="font-weight:700">${escapeHtml(m.user?.full_name || '—')}</div>
        <div style="font-size:12px;color:var(--text-muted)">${escapeHtml(m.project_role || 'عضو تیم')}</div>
      </div>
      <button class="btn btn-sm btn-danger" data-permission="projects.members.manage" onclick="removeMember(${Number(m.user_id)})" title="حذف" aria-label="حذف"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 10v6M14 10v6"/></svg></button>
    </div>
  `).join('')}</div>`;
}

async function loadRoadmap() {
  const el = document.getElementById('roadmap-container');
  el.innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';
  try {
    const res = await Api.getRoadmap(projectId);
    const { stages } = res.data;
    if (!stages.length) {
      el.innerHTML = '<div class="empty-state" style="padding:32px"><div class="empty-state-title">مرحله‌ای برای نقشه راه وجود ندارد</div></div>';
      return;
    }
    el.innerHTML = `
      <div style="padding:20px 0">
        <div style="text-align:center;margin-bottom:24px">
          <div class="badge badge-success" style="font-size:13px;padding:6px 16px"> شروع</div>
        </div>
        <div class="roadmap-timeline">
          ${stages.map((s, i) => {
            const pct = s.progress || 0;
            const done = pct >= 100;
            const active = !done && pct > 0;
            return `
              <div class="roadmap-item">
                <div class="roadmap-connector">
                  <div class="roadmap-dot ${done?'done':active?'active':''}"></div>
                  ${i < stages.length-1 ? '<div class="roadmap-line"></div>' : ''}
                </div>
                <div class="roadmap-content">
                  <div class="roadmap-stage-card ${active?'active':''}">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                      <span style="font-weight:700">${s.order_index+1}. ${escapeHtml(s.name)}</span>
                      ${done ? '<span class="badge badge-success"> تکمیل</span>' : active ? '<span class="badge badge-info"> در جریان</span>' : '<span class="badge badge-gray"> در انتظار</span>'}
                    </div>
                    ${s.description ? `<div style="font-size:13px;color:var(--text-muted);margin-bottom:8px">${escapeHtml(s.description)}</div>` : ''}
                    <div style="display:flex;gap:16px;font-size:12px;color:var(--text-muted);margin-bottom:8px">
                      <span>${s.task_count} وظیفه</span>
                      <span>${s.completed_task_count} انجام‌شده</span>
                      ${s.end_date ? `<span> ${formatDate(s.end_date)}</span>` : ''}
                    </div>
                    ${progressBar(pct)}
                  </div>
                </div>
              </div>`;
          }).join('')}
        </div>
        <div style="text-align:center;margin-top:24px">
          <div class="badge ${project.status==='COMPLETED'?'badge-success':'badge-gray'}" style="font-size:13px;padding:6px 16px">
            ${project.status==='COMPLETED'?' تکمیل شده':' در جریان'}
          </div>
        </div>
      </div>`;
  } catch (e) {
    el.textContent = e.message || 'بارگذاری نقشه راه ناموفق بود';
  }
}

async function saveStage() {
  const btn = document.getElementById('stage-save-btn');
  setLoading(btn, true);
  try {
    const data = {
      name: document.getElementById('sf-name').value.trim(),
      description: document.getElementById('sf-desc').value.trim() || null,
      order_index: parseInt(document.getElementById('sf-order').value) || 0,
      end_date: document.getElementById('sf-end').value || null,
    };
    if (!data.name) { Toast.warning('نام مرحله الزامی است'); return; }
    await Api.createStage(projectId, data);
    Toast.success('مرحله ایجاد شد');
    Modal.close('stage-modal');
    const res = await Api.getProject(projectId);
    project = res.data;
    renderStages(project.stages || []);
  } catch (e) { Toast.error(e.message); }
  finally { setLoading(btn, false); }
}

async function deleteStage(id) {
  confirmAction('آیا از حذف این مرحله مطمئن هستید؟', async () => {
    try {
      await Api.deleteStage(id);
      Toast.success('مرحله حذف شد');
      const res = await Api.getProject(projectId);
      project = res.data;
      renderStages(project.stages || []);
    } catch (e) { Toast.error(e.message); }
  });
}

async function openMemberModal() {
  try {
    const res = await Api.getUsers({ page_size: 100 });
    const sel = document.getElementById('mf-user');
    sel.innerHTML = res.data.items.map(u => `<option value="${u.id}">${escapeHtml(u.full_name || u.username)}</option>`).join('');
    document.getElementById('mf-role').value = '';
    Modal.open('member-modal');
  } catch (e) { Toast.error(e.message); }
}

async function saveMember() {
  const btn = document.getElementById('member-save-btn');
  setLoading(btn, true);
  try {
    await Api.addMember(projectId, {
      user_id: parseInt(document.getElementById('mf-user').value),
      project_role: document.getElementById('mf-role').value.trim() || null,
    });
    Toast.success('عضو اضافه شد');
    Modal.close('member-modal');
    const res = await Api.getProject(projectId);
    project = res.data;
    renderMembers(project.members || []);
  } catch (e) { Toast.error(e.message); }
  finally { setLoading(btn, false); }
}

async function removeMember(userId) {
  confirmAction('آیا از حذف این عضو اطمینان دارید؟', async () => {
    try {
      await Api.removeMember(projectId, userId);
      Toast.success('عضو حذف شد');
      const res = await Api.getProject(projectId);
      project = res.data;
      renderMembers(project.members || []);
    } catch (e) { Toast.error(e.message); }
  });
}
</script>
</body>
</html>
