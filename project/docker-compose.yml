version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: internship_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-internship_db}
      MYSQL_USER: ${MYSQL_USER:-internship_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-internship_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internship_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: internship_backend
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: mysql
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internship_net
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: internship_frontend
    restart: unless-stopped
    networks:
      - internship_net
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  uploads_data:

networks:
  internship_net:
    driver: bridge