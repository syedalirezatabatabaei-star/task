services:
  backend:
    build:
      context: ./backend
    container_name: task_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
    volumes:
      - uploads_data:/app/uploads
    networks:
      task_net:
        aliases:
          - backend
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: task_frontend
    restart: unless-stopped
    networks:
      - task_net
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: task_nginx
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "127.0.0.1:1597:80"
    volumes:
      - ./nginx-task.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - task_net

volumes:
  uploads_data:

networks:
  task_net:
    external: true
    name: project_task_net
