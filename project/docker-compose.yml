services:
  backend:
    build:
      context: ./backend
    container_name: task_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
    volumes:
      - uploads_data:/app/uploads
    networks:
      - task_net
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: task_frontend
    restart: unless-stopped
    networks:
      - task_net
    depends_on:
      - backend
    ports:
      - "127.0.0.1:1597:80"

volumes:
  uploads_data:

networks:
  task_net:
    external: true
    name: task_net
